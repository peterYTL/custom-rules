# HongKongLocal.yaml
# Mihomo Rule-Provider
# Purpose: Hong Kong local financial / government services
# Strategy: conservative domain-only routing; avoid shared/global CDN domains.
#
# Recommended provider settings:
#   behavior: classical
#   format: yaml

payload:
  # ----------------------------------------------------------
  # Bank of China (Hong Kong)
  # Official site: www.bochk.com
  # ----------------------------------------------------------
  - DOMAIN-SUFFIX,bochk.com

  # ----------------------------------------------------------
  # HSBC Hong Kong
  # Keep this HK-specific; deliberately do NOT include hsbc.com
  # ----------------------------------------------------------
  - DOMAIN-SUFFIX,hsbc.com.hk

  # ----------------------------------------------------------
  # ZA Bank
  # Website / bank subdomains:
  # https://bank.za.group/
  # App terms and bank documents also use these exact CDN hosts:
  # https://cdn.za.group/bank/app/info/en/static/1003321.html
  # https://cdn.zaticdn.com/bank/za-bank-portal-web/prd/1.0.3/assets/files/en/terms/Terms%20of%20Use%20of%20Website.pdf
  # CDN hosts can serve other ZA services; domain rules cannot isolate /bank/ paths.
  # Keep exact CDN hosts rather than all za.group / zaticdn.com traffic.
  # This is not a complete inventory of the mobile app's API endpoints.
  # Additional exact hosts observed in ZA Bank App connections (2026-10-11).
  # bankappgw / appguard are siblings of bank.za.group, not its subdomains.
  # Keep zajourney.com hosts out until their routing needs are confirmed.
  # ----------------------------------------------------------
  - DOMAIN-SUFFIX,bank.za.group
  - DOMAIN,bankappgw.za.group
  - DOMAIN,appguard.za.group
  - DOMAIN,bank-sbsmarket.zainvest.group
  - DOMAIN,cdn.za.group
  - DOMAIN,cdn.zaticdn.com

  # ----------------------------------------------------------
  # Faster Payment System (FPS) / HKICL
  # Covers www.hkicl.com.hk and fps.hkicl.com.hk
  # ----------------------------------------------------------
  - DOMAIN-SUFFIX,hkicl.com.hk

  # ----------------------------------------------------------
  # Hong Kong SAR Government
  # Covers www.gov.hk and *.gov.hk, including hkma.gov.hk,
  # info.gov.hk, immd.gov.hk, ird.gov.hk, cr.gov.hk, etc.
  # ----------------------------------------------------------
  - DOMAIN-SUFFIX,gov.hk

  # ----------------------------------------------------------
  # FSM Global / legacy FSMOne / iFAST Financial HK
  # FSMOne HK was rebranded to FSM Global in 2026.
  # Keep legacy domains because redirects/resources may still use them.
  # ----------------------------------------------------------
  - DOMAIN-SUFFIX,fsmglobal.hk
  - DOMAIN-SUFFIX,fsmone.com.hk
  - DOMAIN-SUFFIX,ifastfinancial.com.hk
